name: Platform Story
description: Repo-specific unit of work (roughly a phase within one repo) (platform plane)
type: Story
labels: ["area:platform"]
body:
  - type: markdown
    attributes:
      value: |
        Give the issue a title that states the outcome in one line, in the words a reader would use to recognize it. No track letters, codenames, document names or `[Epic]`-style prefixes.
  - type: textarea
    id: intent
    attributes:
      label: "Intent"
      description: >
        One line: why this, why now.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: "Outcome"
      description: >
        One or two concrete, testable completion statements.
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: "Parent"
      description: >
        Parent Feature or Phase (`infusal/roadmap#nn`).
      placeholder: "infusal/roadmap#nn"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: "Notes"
      description: >
        Open questions, alternatives, risks.
